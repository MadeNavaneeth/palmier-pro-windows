# Dependency review on pull requests: fails the check when a PR introduces a
# dependency with a known vulnerability. Free for public repositories and a
# complement to Dependabot, which keeps existing dependencies current.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
