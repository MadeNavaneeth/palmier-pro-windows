[package]
name = "palmier-compositor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "GPU-accelerated video compositor engine for Palmier Pro Windows"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
napi-build = "2"

# `cargo test` links a standalone test binary, not a cdylib, and on Linux a
# cdylib's `napi_*` references are resolved by the Node process that loads the
# addon -- something a test binary has no equivalent of, so the test harness has
# nothing to link against and the link fails. `dyn-symbols` routes those
# references through a symbol table resolved at startup, which is what Windows
# already does on every target, and `noop` keeps napi from trying to dlopen a
# host that a test binary never has. Same version as [dependencies] so cargo
# unifies the two into one build; dev-only, so a real `cargo build` links the
# .node exactly as before.
[dev-dependencies]
napi = { version = "2", features = ["dyn-symbols", "noop"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
